name: 功能建议
description: 建议新的文件类型、检测能力或交互方式
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你遇到的实际场景
      description: 先说问题，不用先设计功能。
      placeholder: 我经常需要把 Word 简历发给招聘方，但想先清理批注和作者信息……
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望 VeilCheck 怎么帮助你
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在是怎么处理的（可选）
